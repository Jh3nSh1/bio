<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH3N_SH1 info</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a0000;
            color: white;
            position: relative;
        }

        /* Китайский флаг на фоне */
        .china-flag-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -3;
            background: linear-gradient(180deg, #de2910 0%, #b81e0a 40%, #8b1507 60%, #5c0d04 80%, #2d0602 100%);
            animation: flag-wave 8s infinite ease-in-out;
            opacity: 0.85;
        }
        
        @keyframes flag-wave {
            0%, 100% {
                background: linear-gradient(180deg, #de2910 0%, #b81e0a 40%, #8b1507 60%, #5c0d04 80%, #2d0602 100%);
                transform: skewY(0deg);
            }
            25% {
                background: linear-gradient(180deg, #e83212 0%, #c2240d 40%, #9a1a08 60%, #6b1005 80%, #3a0803 100%);
                transform: skewY(1deg);
            }
            50% {
                background: linear-gradient(180deg, #de2910 0%, #b81e0a 40%, #8b1507 60%, #5c0d04 80%, #2d0602 100%);
                transform: skewY(0deg);
            }
            75% {
                background: linear-gradient(180deg, #f03a1a 0%, #d02a10 40%, #a51d0a 60%, #751306 5%, #400a04 100%);
                transform: skewY(-1deg);
            }
        }

        /* Звёзды китайского флага */
        .china-stars {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            color: #ffeb3b;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.8), 0 0 30px rgba(255, 235, 59, 0.5);
            animation: star-glow 2s infinite ease-in-out;
            font-size: 2rem;
        }
        
        .star-1 { top: 5%; left: 10%; font-size: 3.5rem; }
        .star-2 { top: 15%; left: 20%; font-size: 1.5rem; animation-delay: 0.3s; }
        .star-3 { top: 8%; left: 30%; font-size: 1.5rem; animation-delay: 0.6s; }
        .star-4 { top: 20%; left: 35%; font-size: 1.5rem; animation-delay: 0.9s; }
        .star-5 { top: 12%; left: 25%; font-size: 1.2rem; animation-delay: 1.2s; }
        
        @keyframes star-glow {
            0%, 100% {
                text-shadow: 0 0 15px rgba(255, 235, 59, 0.8), 0 0 30px rgba(255, 235, 59, 0.5);
                opacity: 0.9;
            }
            50% {
                text-shadow: 0 0 25px rgba(255, 235, 59, 1), 0 0 50px rgba(255, 235, 59, 0.8), 0 0 75px rgba(255, 235, 59, 0.5);
                opacity: 1;
            }
        }

        /* Кроваво-красный неоновый заголовок */
        .neon-title {
            color: #fff;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            
            font-style: italic;
            
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.4),
                0 0 15px #ff0000,
                0 0 30px #cc0000,
                0 0 45px #990000,
                0 0 60px #660000,
                0 0 80px #440000;
            
            animation: blood-pulse 3s infinite ease-in-out;
            position: relative;
            z-index: 1;
        }

        @keyframes blood-pulse {
            0%, 100% {
                text-shadow: 
                    0 0 8px rgba(255, 255, 255, 0.3),
                    0 0 15px #cc0000,
                    0 0 30px #aa0000,
                    0 0 45px #880000,
                    0 0 60px #550000,
                    0 0 75px #330000;
                color: #ffeeee;
            }
            25% {
                text-shadow: 
                    0 0 8px rgba(255, 255, 255, 0.5),
                    0 0 20px #ff2200,
                    0 0 40px #dd1100,
                    0 0 60px #bb0000,
                    0 0 80px #880000,
                    0 0 100px #550000;
                color: #ffdddd;
            }
            50% {
                text-shadow: 
                    0 0 8px rgba(255, 255, 255, 0.4),
                    0 0 15px #ff0000,
                    0 0 30px #cc0000,
                    0 0 45px #990000,
                    0 0 60px #660000,
                    0 0 80px #440000;
                color: #ffffff;
            }
            75% {
                text-shadow: 
                    0 0 8px rgba(255, 255, 255, 0.6),
                    0 0 25px #ff3300,
                    0 0 50px #ee2200,
                    0 0 75px #cc1100,
                    0 0 100px #990000,
                    0 0 125px #660000;
                color: #ffcccc;
            }
        }

        /* Блок с информацией */
        .profile-info {
            text-align: center;
            line-height: 1.8;
            font-size: 1rem;
            width: 100%;
            max-width: 400px;
            z-index: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }

        .profile-line {
            margin-bottom: 8px;
            text-shadow: 
                0 0 4px rgba(255, 100, 100, 0.8),
                0 0 8px rgba(200, 0, 0, 0.5);
        }

        .label {
            color: #ff8888;
            margin-right: 5px;
            text-shadow: 
                0 0 5px rgba(255, 0, 0, 0.7),
                0 0 10px rgba(180, 0, 0, 0.5);
        }

        .value {
            color: #ffffff;
            font-weight: bold;
            text-shadow: 
                0 0 5px rgba(255, 255, 255, 0.5),
                0 0 10px rgba(255, 50, 50, 0.8),
                0 0 20px rgba(200, 0, 0, 0.6);
            animation: value-glow 2.5s infinite ease-in-out;
        }
        
        @keyframes value-glow {
            0%, 100% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.4), 0 0 10px rgba(255, 30, 30, 0.6), 0 0 20px rgba(180, 0, 0, 0.4);
            }
            50% {
                text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 18px rgba(255, 50, 50, 0.9), 0 0 35px rgba(220, 0, 0, 0.7);
            }
        }

        .checkmark {
            color: #ff4444;
            font-weight: bold;
            margin-right: 8px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.9), 0 0 20px rgba(200, 0, 0, 0.6);
        }

        .section-title {
            font-size: 0.9rem;
            color: #ff9999;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 0, 0, 0.3);
            padding-top: 15px;
            text-shadow: 
                0 0 5px rgba(255, 100, 100, 0.7),
                0 0 10px rgba(200, 0, 0, 0.5);
        }
        
        /* Фото */
        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            object-fit: cover;
            border: 3px solid #4a1010;
            box-shadow: 
                0 0 15px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 0, 0, 0.6),
                inset 0 0 15px rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto 20px;
            background: #0d0000;
        }
    </style>
</head>
